[package]
name = "reposync-rs"
version = "0.1.0"
edition = "2024"

[dependencies]
base64 = "0.22.1"
chrono = "0.4.42"
clap = { version = "4.5.53", features = ["derive"] }
git2 = { version = "0.20.3", features = [
    "vendored-openssl",
    "vendored-libgit2",
] }
rayon = "1.11.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_yaml = "0.9.34"
snafu = "0.8.9"
tracing = "0.1.43"
tracing-subscriber = "0.3.22"
